const img=new Image();img.decoding='async';img.src=SPRITE;
const c=document.getElementById('c'),ctx=c.getContext('2d');
const loading=document.getElementById('loading'),statusEl=document.getElementById('status');
let W=0,H=0,dpr=1;
let yaw=0,depth=0;
let dragging=false,startX=0,startYaw=0;
let anim=null;
const frameW=160,frameH=160;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=c.width=Math.floor(innerWidth*dpr);
 H=c.height=Math.floor(innerHeight*dpr);
 c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
 render();
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function tween(toYaw,toDepth,ms=380){
 if(anim) cancelAnimationFrame(anim);
 const sy=yaw,sd=depth,st=performance.now();
 function step(now){
   const t=clamp((now-st)/ms,0,1),e=ease(t);
   yaw=sy+(toYaw-sy)*e;depth=sd+(toDepth-sd)*e;
   render();sync();
   if(t<1) anim=requestAnimationFrame(step);
 }
 anim=requestAnimationFrame(step);
}
function drawFrame(frameIndex,alpha,localYaw){
 const zoom=1+depth*0.22;
 const scale=Math.max(W/frameW,H/frameH)*zoom;
 const dw=frameW*scale,dh=frameH*scale;
 const lateral=localYaw*W*0.13;
 const vertical=-depth*H*0.018;
 const shear=localYaw*0.08;
 ctx.save();
 ctx.globalAlpha=alpha;
 ctx.translate(W/2+lateral,H/2+vertical);
 ctx.transform(1,shear,0,1,0,0);
 ctx.drawImage(img,frameIndex*frameW,0,frameW,frameH,-dw/2,-dh/2,dw,dh);
 ctx.restore();
}
function render(){
 if(!img.naturalWidth)return;
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const y=clamp(yaw,-1,1);
 if(y<=0){
   const t=y+1;
   drawFrame(0,1-t,y+1);
   drawFrame(1,t,y);
 }else{
   const t=y;
   drawFrame(1,1-t,y);
   drawFrame(2,t,y-1);
 }
 // subtle vignette for depth
 const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.12,W/2,H/2,Math.max(W,H)*0.68);
 g.addColorStop(0,'rgba(0,0,0,0)');
 g.addColorStop(1,'rgba(0,0,0,'+(0.10+depth*0.035)+')');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function sync(){
 const side=yaw<-0.34?'左側':yaw>0.34?'右側':'正面';
 const node=depth<0.5?'入口':depth<1.5?'中段':'靠近山笠';
 statusEl.textContent=node+'｜'+side+'｜深度 '+depth.toFixed(1);
 document.getElementById('left').classList.toggle('active',yaw<-0.34);
 document.getElementById('front').classList.toggle('active',Math.abs(yaw)<=0.34);
 document.getElementById('right').classList.toggle('active',yaw>0.34);
 document.getElementById('back').style.opacity=depth<=0.01?'.35':'1';
 document.getElementById('walk').style.opacity=depth>=2?'.35':'1';
}
c.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startYaw=yaw;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!dragging)return;yaw=clamp(startYaw-(e.clientX-startX)/innerWidth*1.8,-1,1);render();sync()});
c.addEventListener('pointerup',()=>{dragging=false});
c.addEventListener('pointercancel',()=>{dragging=false});

document.getElementById('left').addEventListener('click',()=>tween(-1,depth));
document.getElementById('front').addEventListener('click',()=>tween(0,depth));
document.getElementById('right').addEventListener('click',()=>tween(1,depth));
document.getElementById('walk').addEventListener('click',()=>{if(depth<2)tween(yaw,Math.min(2,depth+1),520)});
document.getElementById('back').addEventListener('click',()=>{if(depth>0)tween(yaw,Math.max(0,depth-1),520)});
document.getElementById('reset').addEventListener('click',()=>tween(0,0,450));

img.onload=()=>{loading.style.display='none';resize();sync();render()};
img.onerror=()=>{loading.textContent='場景圖片載入失敗，請重新整理頁面。'};
addEventListener('resize',resize);
</script></body></html>
