<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DAYONG Agentic 3D v1.5 HD</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#stage{position:fixed;inset:0;background:#000;touch-action:none;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transform:scale(1.02);transition:opacity .38s ease,transform .52s ease;will-change:opacity,transform}
.scene.on{opacity:1;transform:scale(1)}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 68%,rgba(0,0,0,.35));pointer-events:none}
#top{position:fixed;top:10px;left:10px;right:10px;z-index:10;background:#000b;border:1px solid #ffffff2b;border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)}
#top b{font-size:17px}#status{font-size:12px;margin-top:4px;opacity:.92}
#progress{display:flex;gap:6px;margin-top:7px}.dot{height:5px;flex:1;border-radius:99px;background:#ffffff30}.dot.on{background:#19a7ff}
#walk{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:1px solid #ffffff55;background:#0f172ae8;color:white;font-size:34px;z-index:12}
#hint{position:fixed;right:10px;bottom:96px;z-index:11;background:#000a;padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.4}
#nav{position:fixed;left:10px;right:10px;bottom:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;z-index:12}
button{min-height:50px;border-radius:12px;border:1px solid #ffffff44;background:#111827df;color:#fff;font-size:14px}
button.active{background:#078ed1}
button:disabled{opacity:.35}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:20;font-size:15px}
#badge{position:fixed;left:12px;bottom:95px;z-index:11;background:#000a;padding:7px 10px;border-radius:10px;font-size:11px}
</style></head><body>
<div id="stage"><img id="a" class="scene on" alt="3D tour view"><img id="b" class="scene" alt="3D tour next view"><div id="shade"></div></div>
<div id="loading">正在載入 2K 高清場景…</div>
<div id="top"><b>DAYONG Agentic 3D｜高清街景式 3D v1.5</b><div id="status">入口｜正面</div><div id="progress"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div></div>
<button id="walk" type="button" aria-label="往裡面走">↑</button>
<div id="badge">2K 節點 × 9 視角</div>
<div id="hint">左右拖曳或按左右看<br>按 ↑ 往裡面走</div>
<div id="nav">
<button id="left" type="button">左看</button>
<button id="front" type="button" class="active">正面</button>
<button id="right" type="button">右看</button>
<button id="back" type="button" disabled>後退</button>
<button id="reset" type="button">重置</button>
</div>
<script>
const V={"entrance_left":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/1acc81b8-005f-454b-b323-54f0f49f4889_wm.jpg","entrance_front":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/a7848091-db24-462d-b177-551c18986c67_wm.jpg","entrance_right":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/067d5aae-19ad-4998-a86e-88fbd174599e_wm.jpg","mid_left":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/97c6cccf-a099-4430-b977-cf1ca0e404fd_wm.jpg","mid_front":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/c53d92ff-cbb7-43ad-9d99-0df7c9ee53c9_wm.jpg","mid_right":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/6f3296eb-9f6f-4065-a163-8f620ee79934_wm.jpg","near_left":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/efaa5ea9-e936-4fb4-9b38-dc06ee9c2aec_wm.jpg","near_front":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/07773105-973d-43b3-b2f6-f6658fdfccff_wm.jpg","near_right":"https://opcbucket.oss-cn-beijing.aliyuncs.com/sora_banana/api/2026-10-04/db875c64-881c-414b-9f3a-b54ce50530e6_wm.jpg"};
const levels=['entrance','mid','near'],dirs=['left','front','right'];
const levelNames=['入口','中段','山笠前'],dirNames=['左側','正面','右側'];
let level=0,dir=1,busy=false,drag=false,startX=0,startDir=1;
let front=document.getElementById('a'),backLayer=document.getElementById('b');
const loading=document.getElementById('loading');
const urls=Object.values(V);let loaded=0;
urls.forEach(u=>{const im=new Image();im.onload=im.onerror=()=>{loaded++;if(loaded===urls.length) loading.style.display='none'};im.src=u});
function key(l=level,d=dir){return levels[l]+'_'+dirs[d]}
front.src=V[key()];
function sync(){
 document.getElementById('status').textContent=levelNames[level]+'｜'+dirNames[dir];
 document.getElementById('left').classList.toggle('active',dir===0);
 document.getElementById('front').classList.toggle('active',dir===1);
 document.getElementById('right').classList.toggle('active',dir===2);
 document.getElementById('back').disabled=level===0;
 document.getElementById('walk').disabled=level===2;
 [...document.querySelectorAll('.dot')].forEach((e,i)=>e.classList.toggle('on',i===level));
}
function swapTo(l,d,walk=false){
 if(busy)return;busy=true;
 const url=V[levels[l]+'_'+dirs[d]];
 backLayer.onload=()=>{
   backLayer.classList.add('on');
   if(walk){front.style.transform='scale(1.09)';backLayer.style.transform='scale(1)'}
   setTimeout(()=>{
     front.classList.remove('on');
     setTimeout(()=>{
       const tmp=front;front=backLayer;backLayer=tmp;
       backLayer.classList.remove('on');backLayer.style.transform='scale(1.02)';
       level=l;dir=d;sync();busy=false;
     },390);
   },50);
 };
 backLayer.src=url;
}
document.getElementById('left').onclick=()=>swapTo(level,0);
document.getElementById('front').onclick=()=>swapTo(level,1);
document.getElementById('right').onclick=()=>swapTo(level,2);
document.getElementById('walk').onclick=()=>{if(level<2)swapTo(level+1,dir,true)};
document.getElementById('back').onclick=()=>{if(level>0)swapTo(level-1,dir,true)};
document.getElementById('reset').onclick=()=>swapTo(0,1,true);

const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{if(busy)return;drag=true;startX=e.clientX;startDir=dir;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag||busy)return;const dx=e.clientX-startX;const frac=Math.min(1,Math.abs(dx)/innerWidth*2.2);front.style.transform='translateX('+(dx*.10)+'px) scale('+(1+frac*.015)+')'});
stage.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const dx=e.clientX-startX;front.style.transform='scale(1)';if(Math.abs(dx)>innerWidth*.14){const nd=Math.max(0,Math.min(2,startDir+(dx<0?1:-1)));if(nd!==dir)swapTo(level,nd)}});
stage.addEventListener('pointercancel',()=>{drag=false;front.style.transform='scale(1)'});
sync();
</script></body></html>
