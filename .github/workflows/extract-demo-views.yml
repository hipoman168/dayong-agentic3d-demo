name: Extract Demo View Images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-demo-views.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode embedded sprite and crop three views
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          import re,base64,io
          from PIL import Image,ImageEnhance
          s=open('index.html','r',encoding='utf-8').read()
          m=re.search(r'const SPRITE="data:image/(?:webp|jpeg);base64,([^"]+)"',s)
          if not m:
              raise SystemExit('SPRITE not found')
          raw=base64.b64decode(m.group(1))
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          im.save('sprite.webp','WEBP',quality=90)
          names=['left','front','right']
          for i,n in enumerate(names):
              crop=im.crop((i*160,0,(i+1)*160,160)).resize((640,640),Image.Resampling.LANCZOS)
              crop=ImageEnhance.Sharpness(crop).enhance(1.25)
              crop.save(n+'.webp','WEBP',quality=88,method=6)
          PY
      - name: Commit extracted images
        shell: bash
        run: |
          git config user.name "dayong-bot"
          git config user.email "dayong-bot@users.noreply.github.com"
          git add sprite.webp left.webp front.webp right.webp
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish demo reference view images"
          git push
