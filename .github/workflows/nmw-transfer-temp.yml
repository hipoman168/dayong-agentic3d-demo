name: NMW Temporary Transfer
on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: "Public or encrypted GitHub release asset URL"
        required: true
      output_name:
        description: "Artifact name prefix"
        required: true
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split staged archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 "$ASSET_URL" -o payload.bin
          sha256sum payload.bin | tee payload.sha256
          split -b 80m payload.bin payload.part-
          ls -lh payload.part-* payload.sha256
        env:
          ASSET_URL: ${{ inputs.asset_url }}
      - name: Upload part aa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-part-aa
          path: payload.part-aa
          compression-level: 0
          retention-days: 1
      - name: Upload part ab
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-part-ab
          path: payload.part-ab
          compression-level: 0
          retention-days: 1
      - name: Upload part ac
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-part-ac
          path: payload.part-ac
          compression-level: 0
          retention-days: 1
      - name: Upload part ad
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-part-ad
          path: payload.part-ad
          compression-level: 0
          retention-days: 1
      - name: Upload part ae
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-part-ae
          path: payload.part-ae
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-checksum
          path: payload.sha256
          compression-level: 0
          retention-days: 1
