name: DAYONG Cloud Bridge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      asset:
        description: Release asset filename
        required: true
      artifact_name:
        description: Artifact name
        required: true
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$ASSET" --dir bridge
          ls -lh bridge
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: bridge/*
          if-no-files-found: error
          compression-level: 0
