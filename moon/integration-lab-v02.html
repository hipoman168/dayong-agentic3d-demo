<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>New Moon World | Integration Lab v02</title><style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#f4eee3;font:15px system-ui,"Noto Sans TC",sans-serif;overflow:hidden}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;pointer-events:none}header{display:inline-block;background:#0a1424d9;border:1px solid #a68c62;padding:12px 15px;border-radius:14px;max-width:94%;box-shadow:0 12px 35px #0008}h1{font-size:17px;margin:0 0 4px;color:#f6d9a0}small{color:#d5c9b5}#status{position:fixed;top:100px;left:14px;color:#aee6c9;font-size:12px;background:#071521b8;padding:7px;border-radius:7px}#controls{position:fixed;bottom:12px;left:10px;right:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{background:#111b2de8;color:#f4e5ca;border:1px solid #9d8054;border-radius:11px;padding:12px 4px;font-size:14px;min-height:46px}button.active{background:#927449;color:#fff}#hint{position:fixed;bottom:180px;left:12px;right:12px;text-align:center;color:#eee4d1;text-shadow:0 2px 8px black;font-size:12px;pointer-events:none}#fallback{display:none;position:fixed;inset:25% 7% auto;background:#261b21;padding:20px;border:1px solid #ff9a83;border-radius:12px}</style></head><body><div id="hud"><header><h1>NEW MOON WORLD · 星際私人莊園</h1><small>總設計整合測試 v02 · 建築／庭園／客廳／餐廳／主臥</small></header></div><div id="status">3D 引擎初始化中…</div><div id="hint">單指拖曳旋轉 · 雙指縮放 · 點選場景切換</div><div id="controls"><button data-view="overview" class="active">莊園全景</button><button data-view="garden">外牆庭園</button><button data-view="living">豪華客廳</button><button data-view="dining">景觀餐廳</button><button data-view="bedroom">主人臥室</button><button data-view="earth">地球觀景</button></div><div id="fallback"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const status=document.getElementById('status'),fallback=document.getElementById('fallback');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050a16);scene.fog=new THREE.FogExp2(0x080e1d,.007);
const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,1600);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'default'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9cbbff,0x2e2530,2.5));const sun=new THREE.DirectionalLight(0xffe2ba,3.5);sun.position.set(-30,55,35);scene.add(sun);
const mat=(c,metal=0,rough=.7)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,side:THREE.DoubleSide});const white=mat(0xd9d9d0,.35),gold=mat(0xbda074,.7,.25),glass=new THREE.MeshPhysicalMaterial({color:0x6ca9d1,metalness:.25,roughness:.08,transparent:true,opacity:.48,side:THREE.DoubleSide}),stone=mat(0x666875),dark=mat(0x242c3c),green=mat(0x487b6a),warm=mat(0xffc88b);
function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function ball(x,y,z,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.position.set(x,y,z);scene.add(o);return o}
function cyl(x,y,z,r,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);scene.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200,70,70),stone);ground.rotation.x=-Math.PI/2;ground.position.y=-.25;scene.add(ground);
for(let i=0;i<180;i++){let a=i*2.399,r=48+Math.sqrt(i)*9;ball(Math.cos(a)*r,-.1,Math.sin(a)*r,1+(i%7)*.5,mat(i%2?0x565969:0x73727b))}
box(0,.1,0,62,.35,47,dark);box(0,1,0,48,1,31,white);box(0,5,0,43,7,27,glass);box(0,8.7,0,49,1.1,32,white);
for(let x of [-22,22]){box(x,5,0,1,7,29,gold)}for(let z of [-14,14])box(0,5,z,45,7,.5,gold);
box(0,9.8,-7,27,2,15,white);box(0,11,-7,23,.6,13,gold);
box(0,1.1,16,30,.35,10,white);box(0,1.2,22,26,.25,9,gold);
for(let i=-4;i<=4;i++){cyl(i*4,1.6,23,.9,.7,green);ball(i*4,2.5,23,1.1,green)}
for(let x of [-29,29])for(let z of [-19,19]){cyl(x,1.5,z,1,3,gold);ball(x,3.3,z,1.4,warm)}
// furnished open-plan living room
box(-12,1.5,1,14,.7,6,mat(0xede0c8));box(-12,2.4,-1,14,2,.8,mat(0xede0c8));box(-12,1.8,7,7,.5,3,gold);box(-12,2.3,7,4,.3,2,white);
box(-12,1.4,1,18,.1,12,mat(0x907f73));for(let x of [-18,-6])ball(x,3.5,1,.65,warm);
box(9,1.5,-1,12,.7,5,gold);for(let x of [4,9,14])for(let z of [-5,3]){box(x,1.4,z,2,.5,2,white);box(x,2.2,z-1,2,1,.3,white)}
box(9,2,-10,17,3,.7,dark);box(9,3,-9.5,12,1.7,.2,mat(0x273e4e));
box(0,1.5,-8,8,.8,6,white);box(0,2.2,-11,8,2,.7,mat(0xb7a18c));box(0,2,-8,6,.3,3,mat(0xf0e3d4));for(let x of [-2,2])box(x,2.3,-10,2,.3,1,white);
for(let i=0;i<8;i++){let x=-18+i*5;ball(x,8.2,-11,.33,warm)}
// garden ponds and architectural sculptures
box(-23,.35,25,15,.25,9,glass);for(let i=0;i<8;i++)ball(-29+i*1.6,.8,26,.4,white);
for(let x of [-30,30]){cyl(x,2,0,2.2,3,white);ball(x,4.8,0,2.3,green)}
// stars and earth
const stars=new THREE.BufferGeometry(),p=[];for(let i=0;i<1100;i++){const a=Math.random()*Math.PI*2,b=Math.random()*Math.PI*2,r=350+Math.random()*200;p.push(Math.sin(a)*Math.cos(b)*r,Math.sin(b)*r,Math.cos(a)*Math.cos(b)*r)}stars.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffffff,size:1.1})));
ball(115,95,-180,24,mat(0x367cbb,.1,.8));ball(122,100,-163,8,green);
let target=new THREE.Vector3(0,4,0),radius=88,az=.6,el=.35;
const views={overview:[88,.6,.35,0,4,0],garden:[48,.15,.25,0,3,17],living:[16,-.9,.12,-12,2,1],dining:[15,.8,.17,9,2,-1],bedroom:[14,2.5,.12,0,2,-8],earth:[68,-.55,.65,0,5,0]};
function go(k){let v=views[k];radius=v[0];az=v[1];el=v[2];target.set(v[3],v[4],v[5]);document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===k));status.textContent='場景：'+document.querySelector('[data-view="'+k+'"]').textContent+' · 3D Rendering';}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.view));
let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;az-=(e.clientX-px)*.006;el=Math.max(-.2,Math.min(1.3,el+(e.clientY-py)*.004));px=e.clientX;py=e.clientY});renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(7,Math.min(160,radius+e.deltaY*.04))},{passive:true});
function frame(){requestAnimationFrame(frame);camera.position.set(target.x+radius*Math.sin(az)*Math.cos(el),target.y+radius*Math.sin(el),target.z+radius*Math.cos(az)*Math.cos(el));camera.lookAt(target);renderer.render(scene,camera)}go('overview');frame();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){fallback.style.display='block';fallback.textContent='3D 初始化失敗：'+e.message;status.textContent='ERROR';console.error(e)}
</script></body></html>
