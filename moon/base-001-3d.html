function lunarY(x,z){
  const u=Math.max(0,Math.min(8,4+x/DEM_STEP));
  const v=Math.max(0,Math.min(8,4-z/DEM_STEP));
  const x0=Math.floor(u),z0=Math.floor(v),x1=Math.min(8,x0+1),z1=Math.min(8,z0+1);
  const tx=u-x0,tz=v-z0;
  const a=DEM_GRID[z0][x0]*(1-tx)+DEM_GRID[z0][x1]*tx;
  const b=DEM_GRID[z1][x0]*(1-tx)+DEM_GRID[z1][x1]*tx;
  return a*(1-tz)+b*tz;
}

// --- premium exterior redesign v2.3 ---

// Vertical timber fins form a premium entry screen.
for(let x=-7.0;x<=-4.15;x+=.34){

// Second-storey feature fins.

// CC0 PBR starter assets — Poly Haven, downloaded and served locally.
// Runtime never calls the external asset API; files are frozen into our own asset manifest.
const gltfLoader=new GLTFLoader();
const loadedDesignAssets=[];
async function placeDesignAsset(url,opt={}){
  return new Promise((resolve,reject)=>{
    gltfLoader.load(url,g=>{
      const root=g.scene;
      root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
      // Normalize by measured bounding width so furniture uses real-world-like proportions in our scene.
      const b0=new THREE.Box3().setFromObject(root), sz=new THREE.Vector3();b0.getSize(sz);
      const scale=(opt.targetWidth||sz.x)/Math.max(sz.x,.001);
      root.scale.setScalar(scale);
      root.rotation.y=opt.rotationY||0;
      house.add(root);
      root.updateMatrixWorld(true);
      const b1=new THREE.Box3().setFromObject(root);
      const pos=opt.position||new THREE.Vector3();
      root.position.x += pos.x-(b1.min.x+b1.max.x)/2;
      root.position.z += pos.z-(b1.min.z+b1.max.z)/2;
      root.position.y += pos.y-b1.min.y;
      root.userData={assetSource:'Poly Haven',license:'CC0',assetId:opt.assetId||'',provenance:'FROZEN_LOCAL_ASSET'};
      loadedDesignAssets.push(root);
      resolve(root);
    },undefined,reject);
  });

// CC0 Garden Asset Layer — landscape objects stay outside the measured terrain source layer.
const gardenTemplates=new Map();
function loadGardenTemplate(url){
  if(gardenTemplates.has(url)) return gardenTemplates.get(url);
  const p=new Promise((resolve,reject)=>gltfLoader.load(url,g=>resolve(g.scene),undefined,reject));
  gardenTemplates.set(url,p);return p;
}
async function placeGardenAsset(url,opt={}){
  const tpl=await loadGardenTemplate(url);
  const root=tpl.clone(true);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  scene.add(root);root.updateMatrixWorld(true);
  let b=new THREE.Box3().setFromObject(root),sz=new THREE.Vector3();b.getSize(sz);
  const scale=(opt.targetWidth||sz.x)/Math.max(sz.x,.001);
  root.scale.setScalar(scale);root.rotation.y=opt.rotationY||0;root.updateMatrixWorld(true);
  b=new THREE.Box3().setFromObject(root);
  const x=opt.x||0,z=opt.z||0,y=lunarY(x,z)+(opt.raise||0);
  root.position.x += x-(b.min.x+b.max.x)/2;
  root.position.z += z-(b.min.z+b.max.z)/2;
  root.position.y += y-b.min.y;
  root.userData={assetSource:'Poly Haven',license:'CC0',assetId:opt.assetId||'',provenance:'FROZEN_LOCAL_ASSET',layer:'GENERATED_GARDEN_OVERLAY'};
  return root;
}

    aimAt(new THREE.Vector3(0,lunarY(0,16),16));
    statusEl.textContent='展示模式：樓層平面／基地配置';
  }
}
function applyLightingMode(){
  nightMode=!nightMode;
  renderer.toneMappingExposure=nightMode?1.38:1.18;
  hemi.intensity=nightMode?.34:.82;
  ambientFill.intensity=nightMode?.30:.42;
  sun.intensity=nightMode?.72:3.0;
  interiorLights.forEach(l=>l.intensity*=nightMode?1.24:(1/1.24));
  warm1.intensity=nightMode?8.2:6.8;warm2.intensity=nightMode?7.0:5.6;
  document.getElementById('lightMode').textContent=nightMode?'日間燈光':'夜景燈光';
  statusEl.textContent=nightMode?'燈光模式：夜景｜間接燈、重點燈與庭園燈開啟':'燈光模式：日間｜自然光＋室內補光';
}
function goView(name){
  presentationMode='walk';setRoofVisible(true);
  const views={
    gate:{p:new THREE.Vector3(0,lunarY(0,54)+2.1,54),t:new THREE.Vector3(0,3.4,44),s:'城門入口'},
    house:{p:new THREE.Vector3(14,lunarY(14,43)+7.8,43),t:new THREE.Vector3(-1,lunarY(0,16)+3.7,16),s:'示範豪宅 001｜圍界、前庭與高級外觀'},
    living:{p:new THREE.Vector3(-1.3,lunarY(-1.3,20.4)+1.9,20.4),t:new THREE.Vector3(-2.8,lunarY(0,16)+1.2,17.0),s:'一樓豪華客廳'},
    dining:{p:new THREE.Vector3(4.2,lunarY(4.2,18.8)+1.8,18.8),t:new THREE.Vector3(2.6,lunarY(0,16)+1.1,13.5),s:'餐廳與中島廚房'},
    bedroom:{p:new THREE.Vector3(-1.2,lunarY(-1.2,20.0)+4.85,20.0),t:new THREE.Vector3(-3.0,lunarY(0,16)+4.25,16.5),s:'二樓主人套房'},
    garden:{p:new THREE.Vector3(8,lunarY(8,33)+3.0,33),t:new THREE.Vector3(14,lunarY(14,20)+1.2,20),s:'月球景觀庭院｜圍界、水景與植栽'},
    cars:{p:new THREE.Vector3(-6,lunarY(-6,27)+2.8,27),t:new THREE.Vector3(-14,lunarY(-14,14)+.8,14),s:'私人超跑收藏區'},
    upper:{p:new THREE.Vector3(1.8,lunarY(1.8,20.0)+5.05,20.0),t:new THREE.Vector3(-2.0,lunarY(0,16)+4.7,13.2),s:'二樓私人空間'},
    earth:{p:new THREE.Vector3(1,lunarY(1,29)+2.3,29),t:earth.position.clone(),s:'戶外地球景觀台'}
  };
  const v=views[name]; if(!v)return;
  camera.position.copy(v.p); aimAt(v.t); statusEl.textContent='目前位置：'+v.s;
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));
document.getElementById('overview').onclick=()=>setPresentation('overview');
document.getElementById('dollhouse').onclick=()=>setPresentation('dollhouse');
document.getElementById('plan').onclick=()=>setPresentation('plan');
document.getElementById('lightMode').onclick=applyLightingMode;
document.getElementById('reset').onclick=()=>goView('gate');

const tmp=new THREE.Vector3();
function blocked(p){for(const b of colliders){if(b.containsPoint(p))return true}return false}
let prev=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-prev)/1000);prev=t;
 const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 tmp.set(0,0,0);if(keys.w||keys.arrowup)tmp.add(f);if(keys.s||keys.arrowdown)tmp.sub(f);if(keys.a||keys.arrowleft)tmp.sub(r);if(keys.d||keys.arrowright)tmp.add(r);
 if(tmp.lengthSq()){tmp.normalize().multiplyScalar(8*dt);const np=camera.position.clone().add(tmp);if(!blocked(new THREE.Vector3(np.x,np.y,np.z))){camera.position.x=np.x;camera.position.z=np.z}}
 if(keys.w||keys.s||keys.a||keys.d||keys.arrowup||keys.arrowdown||keys.arrowleft||keys.arrowright){camera.position.y=lunarY(camera.position.x,camera.position.z)+2.0;}
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
 renderer.render(scene,camera)
}requestAnimationFrame(loop);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
</script>
