<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>New Moon World | Material Lab v02</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040507;color:#eef2f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#c{width:100%;height:100%;touch-action:none;display:block}
.ui{position:fixed;left:12px;top:12px;z-index:10;background:rgba(7,9,12,.74);backdrop-filter:blur(11px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;max-width:min(350px,72vw);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.ui h1{font-size:16px;margin:0 0 5px}.ui p{font-size:11.5px;line-height:1.5;margin:2px 0;color:#c1cad5}
.badge{display:inline-block;font-size:10.5px;padding:4px 7px;border-radius:999px;background:#1c2430;margin:6px 5px 0 0}
.controls{position:fixed;right:12px;top:12px;z-index:10;display:grid;gap:7px}
button{border:1px solid rgba(255,255,255,.16);background:rgba(10,13,18,.82);color:white;border-radius:11px;padding:9px 11px;font-size:11.5px;cursor:pointer}
.legend{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(6,8,11,.72);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 10px;font-size:10.5px;color:#cbd3dd;white-space:nowrap}
@media(max-width:700px){.controls{top:auto;bottom:50px}.ui{max-width:70vw}.legend{font-size:9.5px}}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
<h1>NMW Material Lab v02</h1>
<p>新版月壤／隕石坑材質測試：多尺度表面、坑緣破碎、撞擊噴出物、微型坑與自然岩塊。</p>
<span class="badge">Procedural PBR</span><span class="badge">Bump Detail</span><span class="badge">Crater v02</span>
</div>
<div class="controls">
<button id="btnLight">切換日照</button>
<button id="btnDetail">切換微細節</button>
<button id="btnWire">線框</button>
<button id="btnReset">重置鏡頭</button>
</div>
<div class="legend">拖曳旋轉 · 滾輪縮放 · v02 仍為 PoC，重點看月壤與隕石坑質感</div>
<script>
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,antialias:true});
engine.setHardwareScalingLevel(Math.min(1.35,window.devicePixelRatio>1?1.15:1));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.006,.008,.012,1);

const camera=new BABYLON.ArcRotateCamera('cam',-1.48,1.06,72,new BABYLON.Vector3(0,-1,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=18;camera.upperRadiusLimit=135;camera.wheelDeltaPercentage=.018;
camera.lowerBetaLimit=.3;camera.upperBetaLimit=1.47;camera.panningSensibility=80;

const hemi=new BABYLON.HemisphericLight('fill',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.11;hemi.diffuse=new BABYLON.Color3(.5,.53,.58);hemi.groundColor=new BABYLON.Color3(.012,.012,.015);
const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.82,-.28,.46),scene);
sun.position=new BABYLON.Vector3(65,74,-50);sun.intensity=4.5;sun.diffuse=new BABYLON.Color3(1,.97,.92);
const shadow=new BABYLON.ShadowGenerator(2048,sun);
shadow.usePercentageCloserFiltering=true;shadow.filteringQuality=BABYLON.ShadowGenerator.QUALITY_HIGH;shadow.bias=.001;

function fract(v){return v-Math.floor(v)}
function hash(x,z){return fract(Math.sin(x*127.1+z*311.7)*43758.5453123)}
function s(t){return t*t*(3-2*t)}
function noise(x,z){
 const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=s(xf),v=s(zf);
 const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);
 return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function fbm(x,z){
 let v=0,a=.5,f=.07;
 for(let i=0;i<6;i++){v+=a*noise(x*f,z*f);f*=2.08;a*=.5}
 return v;
}

const craters=[
{x:-10,z:-5,r:12.5,d:4.9,seed:1},{x:18,z:12,r:8.2,d:3.05,seed:2},
{x:7,z:-23,r:6,d:2.15,seed:3},{x:-27,z:18,r:5,d:1.75,seed:4},
{x:31,z:-18,r:3.8,d:1.15,seed:5},{x:-18,z:-29,r:3,d:.9,seed:6}
];
for(let i=0;i<26;i++)craters.push({x:(hash(i,81)-.5)*106,z:(hash(i,93)-.5)*106,r:1.1+hash(i,107)*1.8,d:.22+hash(i,117)*.5,seed:10+i});

function craterHeight(x,z,c){
 const dx=x-c.x,dz=z-c.z,rr=Math.hypot(dx,dz),r=rr/c.r;
 if(r>2.1)return 0;
 const ang=Math.atan2(dz,dx);
 const edgeNoise=(noise(Math.cos(ang)*3+c.seed,Math.sin(ang)*3-c.seed)-.5);
 const re= r*(1+edgeNoise*.08);
 const bowl=re<1 ? -c.d*Math.pow(Math.max(0,1-re*re),1.85) : 0;
 const rim=c.d*(.28+.1*noise(c.seed+ang*2,ang))*Math.exp(-Math.pow((re-1.02)/.14,2));
 const terracing=(re<.96&&re>.42)?c.d*.055*Math.sin((re-.42)*30)*(1-re):0;
 const rays=re>1&&re<2.0?c.d*.075*Math.exp(-(re-1)*2.25)*(Math.max(0,Math.cos(ang*7+c.seed*1.7))*.65+.35)*(noise(x*.52,z*.52)-.25):0;
 return bowl+rim+terracing+rays;
}

let detailGain=1;
function terrainHeight(x,z){
 let h=(fbm(x,z)-.5)*1.55*detailGain;
 h+=(fbm(x*2.8+17,z*2.8-9)-.5)*.48*detailGain;
 h+=(noise(x*.72,z*.72)-.5)*.18*detailGain;
 for(const c of craters)h+=craterHeight(x,z,c);
 return h;
}

const ground=BABYLON.MeshBuilder.CreateGround('lunar',{width:116,height:116,subdivisions:190,updatable:true},scene);
const pos=ground.getVerticesData(BABYLON.VertexBuffer.PositionKind),inds=ground.getIndices();
function updateGround(){
 for(let i=0;i<pos.length;i+=3)pos[i+1]=terrainHeight(pos[i],pos[i+2]);
 ground.updateVerticesData(BABYLON.VertexBuffer.PositionKind,pos);
 const n=[];BABYLON.VertexData.ComputeNormals(pos,inds,n);ground.updateVerticesData(BABYLON.VertexBuffer.NormalKind,n);
}
updateGround();ground.receiveShadows=true;

function makeRegolithTexture(name,size,bump=false){
 const tex=new BABYLON.DynamicTexture(name,{width:size,height:size},scene,false);
 const ctx=tex.getContext(),img=ctx.createImageData(size,size),d=img.data;
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
   const nx=x/size*12,ny=y/size*12;
   let v=.58;
   v+=(noise(nx,ny)-.5)*.17;
   v+=(noise(nx*4.2+7,ny*4.2-3)-.5)*.085;
   v+=(noise(nx*13.5-4,ny*13.5+11)-.5)*.04;
   const speck=hash(x*.17,y*.17); if(speck>.985)v-=.18*(speck-.985)/.015;
   v=Math.max(.18,Math.min(.82,v));
   const i=(y*size+x)*4;
   if(bump){const g=Math.floor(v*255);d[i]=d[i+1]=d[i+2]=g}
   else{
      d[i]=Math.floor(v*118);
      d[i+1]=Math.floor(v*116);
      d[i+2]=Math.floor(v*112);
   }
   d[i+3]=255;
 }
 ctx.putImageData(img,0,0);tex.update(false);
 tex.wrapU=tex.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;tex.uScale=tex.vScale=9;
 return tex;
}
const albedoTex=makeRegolithTexture('regolithAlbedo',512,false);
const bumpTex=makeRegolithTexture('regolithBump',512,true);

const mat=new BABYLON.PBRMaterial('lunarPBR',scene);
mat.albedoTexture=albedoTex;mat.albedoColor=new BABYLON.Color3(.66,.66,.67);
mat.bumpTexture=bumpTex;mat.bumpTexture.level=.78;mat.invertNormalMapY=true;
mat.metallic=0;mat.roughness=.94;mat.microSurface=.13;mat.environmentIntensity=.08;
ground.material=mat;

const rockMat=new BABYLON.PBRMaterial('rockMat',scene);
rockMat.albedoColor=new BABYLON.Color3(.29,.285,.28);rockMat.roughness=.98;rockMat.metallic=0;
rockMat.bumpTexture=bumpTex;rockMat.bumpTexture.level=.35;

function makeRock(i,x,z,sz){
 const m=BABYLON.MeshBuilder.CreateIcoSphere('rock'+i,{radius:sz,subdivisions:2,flat:false},scene);
 const p=m.getVerticesData(BABYLON.VertexBuffer.PositionKind);
 for(let k=0;k<p.length;k+=3){
   const vx=p[k],vy=p[k+1],vz=p[k+2];
   const n=1+(hash(i+k,vx*17+vz*11)-.5)*.30;
   p[k]=vx*n;p[k+1]=vy*n*(.55+hash(i,9)*.38);p[k+2]=vz*n;
 }
 m.updateVerticesData(BABYLON.VertexBuffer.PositionKind,p);
 const ni=[];BABYLON.VertexData.ComputeNormals(p,m.getIndices(),ni);m.updateVerticesData(BABYLON.VertexBuffer.NormalKind,ni);
 m.position.set(x,terrainHeight(x,z)+sz*.32,z);
 m.rotation.set(hash(i,31)*.8,hash(i,47)*Math.PI*2,hash(i,61)*.5);
 m.material=rockMat;shadow.addShadowCaster(m);return m;
}
for(let i=0;i<118;i++){
 const x=(hash(i,11)-.5)*108,z=(hash(i,29)-.5)*108;
 let rimBias=.42;
 for(const c of craters){const rr=Math.hypot(x-c.x,z-c.z);if(rr>c.r*.84&&rr<c.r*1.5)rimBias=1.15}
 const sz=.18+hash(i,47)*rimBias*1.18;
 makeRock(i,x,z,sz);
}

const sky=BABYLON.MeshBuilder.CreateSphere('sky',{diameter:500,segments:12},scene);
const skyMat=new BABYLON.StandardMaterial('sky',scene);skyMat.backFaceCulling=false;skyMat.disableLighting=true;skyMat.emissiveColor=new BABYLON.Color3(.003,.004,.007);sky.material=skyMat;

const earth=BABYLON.MeshBuilder.CreateSphere('earth',{diameter:8.5,segments:40},scene);
earth.position.set(-72,44,96);
const earthMat=new BABYLON.PBRMaterial('earthMat',scene);earthMat.albedoColor=new BABYLON.Color3(.06,.20,.38);earthMat.emissiveColor=new BABYLON.Color3(.012,.04,.075);earthMat.roughness=.6;earth.material=earthMat;

scene.imageProcessingConfiguration.toneMappingEnabled=true;
scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure=1.08;
scene.imageProcessingConfiguration.contrast=1.23;

let lightMode=0,wire=false;
document.getElementById('btnLight').onclick=()=>{
 lightMode=(lightMode+1)%3;
 const ds=[[-.82,-.28,.46],[-.46,-.14,.88],[.72,-.24,-.64]];
 sun.direction=new BABYLON.Vector3(...ds[lightMode]);
};
document.getElementById('btnDetail').onclick=()=>{
 detailGain=detailGain===1?1.35:.78;updateGround();mat.bumpTexture.level=detailGain>1?1.0:.55;
};
document.getElementById('btnWire').onclick=()=>{wire=!wire;mat.wireframe=wire;rockMat.wireframe=wire};
document.getElementById('btnReset').onclick=()=>{camera.alpha=-1.48;camera.beta=1.06;camera.radius=72;camera.target.set(0,-1,0)};
engine.runRenderLoop(()=>scene.render());
addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
